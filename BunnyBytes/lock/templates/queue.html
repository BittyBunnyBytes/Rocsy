<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPU Queue - BunnyBytes</title>
  <link rel="stylesheet" href="{{ mount_prefix }}/static/css/queue.css?v={{ app_version }}">
</head>
<body data-mount-prefix="{{ mount_prefix }}">
  <div class="topbar">
    <div class="brand"><span class="brand-mark">Q</span> GPU Queue</div>
  </div>
  <main>
    <div class="page-heading"><div><p class="eyebrow">Shared GPU scheduler</p><h1>Active &amp; Waiting Jobs</h1><p class="intro">Drag waiting cards to reorder them. Lock position to keep a card in its slot.</p></div><div class="heading-actions"><span id="mode-indicator" class="live-indicator"><i></i> Live updates</span><button id="restart-comfyui" class="restart-comfyui" type="button">Restart ComfyUI + supervisor</button><button id="demo-toggle" class="demo-toggle" type="button">Load 10 test jobs</button></div></div>
    <p id="queue-message" class="queue-message" role="status" hidden></p>
    <div id="entries" class="queue-grid" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>Nothing queued right now.</div>
  </main>
  <script src="{{ mount_prefix }}/static/js/queue.js?v={{ app_version }}"></script>
</body>
</html>
